name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ledger-api

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------
      # Secrets Scan
      # --------------------
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------
      # SAST
      # --------------------
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      # --------------------
      # Filesystem Scan
      # --------------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL

      # --------------------
      # Login GHCR
      # --------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------
      # Build Image
      # --------------------
      - name: Build Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} ./app

      # --------------------
      # Image Scan
      # --------------------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL

      # --------------------
      # Push Image
      # --------------------
      - name: Push Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}

      # --------------------
      # Cosign
      # --------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image
        run: |
          cosign sign --yes $IMAGE_NAME:${{ github.sha }}

      # --------------------
      # SLSA Provenance
      # --------------------
      - name: Generate Provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2
