apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-ledger
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-ledger
  template:
    metadata:
      labels:
        app: insecure-ledger
    spec:
      containers:
      - name: nginx
        image: nginx:latest
