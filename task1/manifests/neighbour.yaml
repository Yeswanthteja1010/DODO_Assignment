apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporting-sa
  namespace: payments

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: payments
spec:
  replicas: 1

  selector:
    matchLabels:
      app: reporting

  template:
    metadata:
      labels:
        app: reporting

    spec:
      serviceAccountName: reporting-sa

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: reporting

        image: curlimages/curl:8.8.0

        command:
          - sleep
          - infinity

    
            
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

        resources:
          requests:
            cpu: 50m
            memory: 64Mi

          limits:
            cpu: 100m
            memory: 128Mi
