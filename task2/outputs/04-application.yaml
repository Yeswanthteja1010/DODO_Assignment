apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ledger-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Yeswanthteja1010/DODO_Assignment.git
    targetRevision: main
    path: task1/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: payments

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
